<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alo Assistant Demo</title>
<style>
  :root { --bg:#faf9f7; --card:#fff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e4e2de; --accent:#2f5d50;
          --ok:#2f7d4f; --warn:#a86a00; --bad:#b3372f; --chip:#eef2ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161617; --card:#1f1f21; --ink:#f2f2f3; --mute:#9a9aa0; --line:#34343a; --accent:#7cc4ad;
            --ok:#6fcf93; --warn:#e0a84a; --bad:#ee7a72; --chip:#26302c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  .sub { color:var(--mute); font-size:.9rem; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--mute); margin-bottom:4px; }
  select, textarea { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line);
                     border-radius:8px; padding:10px; }
  textarea { resize:vertical; min-height:72px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; margin-bottom:12px; }
  .row > div { flex:1 1 220px; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; background:var(--accent); color:#fff; }
  @media (prefers-color-scheme: dark) { button { color:#102019; } }
  button:disabled { opacity:.5; cursor:wait; }
  .examples { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .examples button { background:var(--chip); color:var(--ink); font-size:.85rem; padding:6px 10px; }
  .badge { display:inline-block; font-size:.78rem; font-weight:600; border-radius:999px; padding:2px 10px; border:1px solid currentColor; }
  .answered { color:var(--ok); } .partial { color:var(--warn); } .not_in_data, .declined { color:var(--bad); }
  .answer { white-space:pre-wrap; margin:12px 0; }
  .meta { color:var(--mute); font-size:.85rem; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip { background:var(--chip); border-radius:6px; padding:2px 8px; font:.8rem ui-monospace,monospace; }
  details { margin-top:10px; } summary { cursor:pointer; color:var(--mute); font-size:.9rem; }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px;
        font-size:.8rem; max-height:320px; overflow:auto; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Alo Assistant</h1>
  <div class="sub" id="sub">Loading…</div>

  <div class="card">
    <div class="row">
      <div>
        <label for="cust">Signed in as</label>
        <select id="cust"><option value="">Not signed in</option></select>
      </div>
    </div>
    <label for="q">Your question</label>
    <textarea id="q" placeholder="Ask about products, policies, or your own orders"></textarea>
    <div class="row" style="margin-top:12px;margin-bottom:0"><button id="go">Ask</button><span class="meta" id="state"></span></div>
    <div class="examples" id="examples"></div>
  </div>

  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('/config').then(r => r.json()).then(cfg => {
  $('sub').textContent = `Answers come only from the policies, catalog and your own orders. Assumed today: ${cfg.as_of}.`;
  cfg.customers.forEach(c => $('cust').add(new Option(`${c.name} (${c.id}, ${c.tier})`, c.id)));
  cfg.examples.forEach(t => {
    const b = document.createElement('button'); b.textContent = t;
    b.onclick = () => { $('q').value = t; ask(); }; $('examples').append(b);
  });
});

async function ask() {
  const query = $('q').value.trim(); if (!query) return;
  $('go').disabled = true; $('state').textContent = 'Thinking…'; $('out').innerHTML = '';
  try {
    const res = await fetch('/ask', { method:'POST', headers:{'Content-Type':'application/json'},
                                      body: JSON.stringify({ query, customer_id: $('cust').value || null }) });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    const chips = d.citations.map(c => `<span class="chip">${esc(c)}</span>`).join('') || '<span class="meta">none</span>';
    const tools = d.tool_calls.map(t => `${t.name}(${JSON.stringify(t.args)}) → ${t.returned.join(', ') || 'no results'}`).join('\n');
    const issues = d.data_issues.length ? `<div class="meta">Data issues noticed: ${esc(d.data_issues.join('; '))}</div>` : '';
    $('out').innerHTML = `<div class="card">
      <span class="badge ${esc(d.status)}">${esc(d.status.replace('_',' '))}</span>
      <span class="meta"> &nbsp;routed to: ${esc(d.routed.join(', ') || 'nothing (out of scope)')} · ${(d.ms/1000).toFixed(1)} s</span>
      <div class="answer">${esc(d.answer)}</div>
      <div class="meta">Sources cited</div><div class="chips">${chips}</div>${issues}
      ${tools ? `<details><summary>Catalog lookups</summary><pre>${esc(tools)}</pre></details>` : ''}
      <details><summary>Exactly what the model was shown</summary><pre>${esc(d.context || '(nothing: no model call was needed)')}</pre></details>
    </div>`;
    $('state').textContent = '';
  } catch (e) {
    $('out').innerHTML = `<div class="card err">Something went wrong: ${esc(e.message)}</div>`; $('state').textContent = '';
  } finally { $('go').disabled = false; }
}
$('go').onclick = ask;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask(); });
</script>
</body>
</html>
